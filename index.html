<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="src/main.js"></script>
    <title>To-Do List</title>
</head>
<body>
    <header>
        <h1>Todo List | Wagner</h1>
    </header>

    <main>
        <p>Projeto de cotrole de taferas, estilo To-Do List!</p>

        <section clasName="addTask-container">
            <label for="addTask">
                <h3>Adcionar Tarefa</h3>
            </label>
            <input id="addTask" type="text">
            <button>Adicionar</button>
        </section>

        <div className="tasks-container">
            <h3>Tarefas</h3>
            <ul clasName="tasks-list">
                    <button><li>Comprar ração para o gato!</li></button>
                    <li>Tirar o lixo para fora</li>
                    <li>Lavar o carro</li>
                    <li>Marcar consulta médica</li>
            </ul>
        </div>
    </main>

    <footer>
        <p>&copf; 2026. WagnerAraújo. Todos os direitos reservados</p>
    </footer>
    
</body>
</html>
